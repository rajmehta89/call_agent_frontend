<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#32136B">
  <title>RelayDesk is offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; color: #32136B; background: #F8F5FF; }
    main { width: min(100%, 26rem); }
    .mark { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: .9rem; color: white; background: #6C3BFF; font-weight: 800; font-size: 1.25rem; }
    h1 { margin: 1.5rem 0 .5rem; font-size: clamp(1.7rem, 5vw, 2.25rem); letter-spacing: -.03em; }
    p { margin: 0 0 1.5rem; color: #5B4A77; line-height: 1.6; }
    button { border: 0; border-radius: .7rem; padding: .8rem 1.25rem; color: white; background: #6C3BFF; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #32136B; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">R</div>
    <h1>RelayDesk is offline</h1>
    <p>Reconnect to the internet to access calls, messages and customer records.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
